name: Update README

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      linkedin_posts:
        description: "LinkedIn posts count (leave empty to keep current)"
        required: false
      linkedin_followers:
        description: "LinkedIn followers count (leave empty to keep current)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record LinkedIn numbers
        if: ${{ inputs.linkedin_posts != '' || inputs.linkedin_followers != '' }}
        env:
          POSTS: ${{ inputs.linkedin_posts }}
          FOLLOWERS: ${{ inputs.linkedin_followers }}
        run: |
          python - <<'EOF'
          import json, os, datetime, pathlib
          p = pathlib.Path("data/linkedin.json")
          d = json.loads(p.read_text())
          for key, env in (("posts", "POSTS"), ("followers", "FOLLOWERS")):
              v = os.environ[env].replace(",", "").strip()
              if v:
                  d[key] = int(v)
          d["updated"] = datetime.date.today().isoformat()
          p.write_text(json.dumps(d, indent=2) + "\n")
          EOF
      - name: Refresh auto-generated sections
        run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md assets data
          git commit -m "auto-update profile stats" || exit 0
          git push
