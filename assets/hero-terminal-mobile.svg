<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-label="Terminal running an agent pipeline that profiles Vinay Kumar Reddy">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <style>
      .mono { white-space: pre; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
      .dim { fill: #8b949e; } .ok { fill: #7ee787; } .pur { fill: #c297ff; } .cy { fill: #79c0ff; }
      .yel { fill: #e3b341; } .wh { fill: #e6edf3; } .pink { fill: #ff7b72; }
      .l { opacity: 0; animation: show .35s ease-out forwards; }
      .l1 { animation-delay: .4s } .l2 { animation-delay: 1.4s } .l3 { animation-delay: 2.2s }
      .l4 { animation-delay: 3.0s } .l5 { animation-delay: 3.8s } .l6 { animation-delay: 4.6s }
      .l7 { animation-delay: 5.4s } .l8 { animation-delay: 6.4s } .l9 { animation-delay: 7.4s }
      .l10 { animation-delay: 8.2s }
      @keyframes show { from { opacity: 0 } to { opacity: 1 } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .border { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 2.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .bar { animation: fill 1.6s ease-in-out forwards; animation-delay: 6.5s; transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
      @keyframes fill { to { transform: scaleX(1) } }
    </style>
  </defs>

  <rect x="8" y="8" width="384" height="584" rx="14" fill="#0d1117"/>
  <rect class="border" x="8" y="8" width="384" height="584" rx="14" fill="none" stroke="url(#glow)" stroke-width="2"/>
  <rect x="9" y="9" width="382" height="34" rx="13" fill="#161b22"/>
  <rect x="9" y="30" width="382" height="13" fill="#161b22"/>
  <circle cx="30" cy="26" r="5.5" fill="#ff5f57"/><circle cx="48" cy="26" r="5.5" fill="#febc2e"/><circle cx="66" cy="26" r="5.5" fill="#28c840"/>
  <text x="230" y="31" text-anchor="middle" class="mono dim" font-size="12">vinay@bengaluru: ~/agents</text>

  <g class="mono" xml:space="preserve">
    <g class="l l1">
      <text x="26" y="80"><tspan class="ok">➜</tspan><tspan class="cy"> ~/agents</tspan><tspan class="wh"> agent run</tspan></text>
      <text x="26" y="102"><tspan class="yel" x="60">--goal</tspan><tspan class="wh"> "who is Vinay?"</tspan></text>
    </g>

    <g class="l l2"><text x="26" y="142"><tspan class="pur">▸ router</tspan><tspan class="wh" x="132">parse intent</tspan></text><text x="374" y="142" text-anchor="end" class="ok">ok</text></g>
    <g class="l l3"><text x="26" y="170"><tspan class="pur">▸ retriever</tspan><tspan class="wh" x="132">BM25+pgvector</tspan></text><text x="374" y="170" text-anchor="end" class="ok">50+ repos</text></g>
    <g class="l l4"><text x="26" y="198"><tspan class="pur">▸ tools</tspan><tspan class="wh" x="132">mcp://linkedin</tspan></text><text x="374" y="198" text-anchor="end" class="ok">39 posts</text></g>
    <g class="l l5"><text x="26" y="226"><tspan class="pur">▸ memory</tspan><tspan class="wh" x="132">context-layer</tspan></text><text x="374" y="226" text-anchor="end" class="ok">loaded</text></g>
    <g class="l l6"><text x="26" y="254"><tspan class="pur">▸ composer</tspan><tspan class="wh" x="132">ground · cite</tspan></text><text x="374" y="254" text-anchor="end" class="ok">done</text></g>
    <g class="l l7">
      <text x="26" y="282"><tspan class="pur">▸ judge</tspan><tspan class="wh" x="132">grounded=</tspan><tspan class="ok">true</tspan></text>
      <text x="26" y="304"><tspan class="wh" x="132">cited=</tspan><tspan class="ok">true</tspan></text>
      <text x="26" y="326"><tspan class="wh" x="132">hallucinated=</tspan><tspan class="pink">false</tspan></text>
      <rect x="26" y="342" width="348" height="8" rx="4" fill="#21262d"/>
      <rect class="bar" x="26" y="342" width="348" height="8" rx="4" fill="url(#glow)"/>
    </g>

    <g class="l l8">
      <text x="26" y="392"><tspan class="ok">✔ answer</tspan></text>
      <text x="26" y="418"><tspan class="wh" x="44">Gen AI Engineer who ships</tspan></text>
      <text x="26" y="442"><tspan class="pur" x="44">RAG</tspan><tspan class="wh">, </tspan><tspan class="pur">multi-agent systems</tspan></text>
      <text x="26" y="466"><tspan class="wh" x="44">&amp;</tspan><tspan dx="8"></tspan><tspan class="pur">MCP</tspan></text>
    </g>
    <g class="l l9">
      <text x="26" y="500" class="dim" font-size="12" dx="18">↳ sources: github · linkedin</text>
    </g>

    <g class="l l10">
      <text x="26" y="550"><tspan class="ok">➜</tspan><tspan class="cy"> ~/agents</tspan></text>
      <rect class="cursor" x="122" y="537" width="9" height="17" fill="#c297ff"/>
    </g>
  </g>
</svg>
